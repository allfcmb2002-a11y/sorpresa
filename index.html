<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una sorpresa para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Nunito:wght@400;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3cf7a;--red:#e0314b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d2a17;font-family:'Nunito',system-ui,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0}
#flash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,rgba(255,244,205,.98),rgba(255,214,120,.55) 45%,rgba(255,214,120,0) 75%)}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#fff;cursor:pointer;background:radial-gradient(ellipse at center,rgba(5,20,10,.25),rgba(5,20,10,.78));transition:opacity 1s}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{margin:0;font:italic 600 clamp(2rem,7vw,3.6rem)/1.1 'Fraunces',Georgia,serif;color:var(--gold);text-shadow:0 2px 24px rgba(0,0,0,.7)}
#intro p{margin:0;font-size:1.05rem;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.97)}}
#card{position:fixed;z-index:4;left:50%;bottom:max(3.5vh,env(safe-area-inset-bottom));width:min(620px,92vw);padding:22px 26px 20px;text-align:center;color:#fff;background:linear-gradient(160deg,rgba(78,16,52,.80),rgba(32,10,40,.78));border:1px solid rgba(255,190,215,.7);border-radius:22px;box-shadow:0 0 55px rgba(255,140,190,.5),inset 0 0 30px rgba(255,190,215,.12);opacity:0;pointer-events:none;transform:translateX(-50%) translateY(50px) scale(.88);transition:opacity 1.1s ease,transform 1.2s cubic-bezier(.2,1.2,.3,1)}
#card.show{opacity:1;transform:translateX(-50%) none;pointer-events:auto}
#card h2{margin:0 0 8px;font:italic 600 clamp(2rem,8.5vw,3.5rem)/1.08 'Fraunces',Georgia,serif;filter:drop-shadow(0 0 10px rgba(255,150,195,.7))}
#card h2 .l{display:inline-block;background:linear-gradient(180deg,#fffaf0 0%,#ffe3a6 40%,#d9a24a 75%,#fff0c8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(24px) scale(.5) rotate(-10deg)}
#card.show h2 .l{animation:pop .8s cubic-bezier(.2,1.7,.4,1) forwards;animation-delay:calc(var(--i)*70ms + 300ms)}
@keyframes pop{to{opacity:1;transform:none}}
#card .q,#card .from,#card button{opacity:0;transition:opacity 1.2s ease 1.9s}
#card.show .q,#card.show .from,#card.show button{opacity:1}
#card .q{margin:0 auto 12px;max-width:34ch;font-size:clamp(.95rem,3.4vw,1.1rem);line-height:1.5}
#card .from{margin:0;font:clamp(1.9rem,7vw,2.7rem)/1.2 'Pinyon Script','Brush Script MT',cursive;color:#ffd6dc}
#card .from b{font-weight:400;color:var(--gold)}
#card .heart{display:inline-block;color:var(--red);animation:beat 1.1s ease-in-out infinite;will-change:transform}
@keyframes beat{30%{transform:scale(1.35)}60%{transform:scale(1)}}
#card button{margin-top:12px;padding:8px 18px;font:600 .9rem 'Nunito',sans-serif;color:#fff;background:transparent;border:1px solid rgba(243,207,122,.6);border-radius:999px;cursor:pointer}
#card button:hover,#card button:focus-visible{background:rgba(243,207,122,.18);outline:none}
#card{border:1px solid transparent}
#card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(120deg,#ffd3e2,#f2c46f,#ff7eb6,#ffd3e2);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#card .top{margin:0 0 2px;font:clamp(1.4rem,5vw,1.9rem)/1.2 'Pinyon Script','Brush Script MT',cursive;color:#ffc2d9;opacity:0;transition:opacity 1.2s ease .9s;letter-spacing:.04em;font-size:clamp(1.5rem,5vw,2.1rem)}
#card.show .top{opacity:1}
#card .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 10px;color:#ff8fb8;opacity:0;transition:opacity 1.2s ease 1.6s}
#card.show .orn{opacity:1}
#card .orn i{flex:0 0 min(80px,18vw);height:1px;background:linear-gradient(90deg,transparent,#f2c46f,transparent)}
#card .q.wish{min-height:4.4em;display:flex;align-items:center;justify-content:center;max-width:36ch;font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(1.05rem,3.9vw,1.35rem);line-height:1.4;color:#fff4f8;text-shadow:0 1px 8px rgba(0,0,0,.6);transform:translateY(10px);transition:opacity .7s ease,transform .7s ease}
#card.show .q.wish{opacity:0}
#card.show .q.wish.in{opacity:1;transform:none}
#shade{position:fixed;left:0;right:0;bottom:0;height:64vh;z-index:3;pointer-events:none;opacity:0;transition:opacity 2.2s ease;background:linear-gradient(to top,rgba(14,2,20,.85),rgba(14,2,20,.45) 55%,transparent)}
body.party #shade{opacity:1}
/* sin backdrop-filter: era el mayor costo por frame sobre el canvas */
#card{width:min(680px,92vw);padding:36px 34px 22px;background:radial-gradient(120% 90% at 50% 0%,rgba(130,30,85,.55),transparent 62%),linear-gradient(165deg,rgba(40,8,38,.97),rgba(14,5,30,.98));box-shadow:0 22px 70px rgba(0,0,0,.7),0 0 0 1px rgba(243,207,122,.25),0 0 46px rgba(255,140,190,.3);will-change:transform,opacity}
#card::after{content:'';position:absolute;inset:8px;border:1px solid rgba(243,207,122,.45);border-radius:16px;pointer-events:none}
#card .seal{position:absolute;top:-27px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:radial-gradient(circle at 35% 30%,#4a1440,#16051f);border:2px solid #f3cf7a;box-shadow:0 0 22px rgba(243,207,122,.55),inset 0 0 12px rgba(255,160,200,.25)}
#card .cn{position:absolute;font-size:.95rem;line-height:1;color:#f3cf7a;text-shadow:0 0 10px rgba(243,207,122,.8)}
.tl{top:15px;left:17px}.tr{top:15px;right:17px}.bl{bottom:15px;left:17px}.br{bottom:15px;right:17px}
#intro .gift{font-size:4.2rem;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 18px rgba(255,160,200,.6))}
@keyframes bob{50%{transform:translateY(-12px) rotate(-6deg)}}
#intro p{padding:10px 26px;border:1px solid rgba(243,207,122,.6);border-radius:999px;background:rgba(0,0,0,.28)}
</style>
</head>
<body>
<div id="flash"></div>
<div id="intro"><div class="gift">🎁</div><h1>Hay una sorpresa<br>esperándote</h1><p>Toca la pantalla</p></div>
<div id="shade"></div>
<div id="card" role="status">
  <div class="seal">🎂</div><span class="cn tl">❖</span><span class="cn tr">❖</span><span class="cn bl">❖</span><span class="cn br">❖</span>
  <p class="top">Hoy es tu día</p>
  <h2>¡Feliz cumpleaños!</h2>
  <div class="orn"><i></i><span>✦ ♥ ✦</span><i></i></div>
  <p class="q wish"></p>
  <p class="from">Te desea <b>Fernando Ortiz</b> <span class="heart">♥</span></p>
  <button id="again">Volver a verlo</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const rnd = (a, b) => a + Math.random() * (b - a);
const ease = t => .5 - .5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));
const backOut = t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- escena ---------- */
const FOG = 0x0d2a17, Z = .9, TX = -2.7;
const MOB = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 600;
const renderer = new THREE.WebGLRenderer({ antialias: !MOB, powerPreference: 'high-performance' });
let PR = Math.min(devicePixelRatio, MOB ? 1 : 1.25);
renderer.setPixelRatio(PR); renderer.shadowMap.enabled = !MOB; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;           // las sombras se actualizan a mano (cada 2 frames)
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.FogExp2(FOG, 0.027);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .1, 120);
camera.position.set(-2, 4, 18);
const hemi = new THREE.HemisphereLight(0xbfe0a0, 0x0f2a14, .6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe9b0, 1.7); sun.position.set(-12, 24, 14); scene.add(sun);
sun.castShadow = true; sun.shadow.radius = 3; sun.shadow.mapSize.set(MOB ? 512 : 1024, MOB ? 512 : 1024); sun.shadow.bias = -.0006; sun.shadow.normalBias = .04;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 70 });
sun.target.position.set(-4, 7, 0); scene.add(sun.target);
const rim = new THREE.DirectionalLight(0xffd7c0, .7); rim.position.set(8, 10, -10); if (!MOB) scene.add(rim);

const lam = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .9, envMapIntensity: .45 }, o));
const mesh = (g, c) => new THREE.Mesh(g, lam(c));
const SPH = new THREE.SphereGeometry(1, 20, 16);
const tex = (draw, s = 128) => { const c = document.createElement('canvas'); c.width = c.height = s; draw(c.getContext('2d'), s); return new THREE.CanvasTexture(c); };
const glowTex = tex((x, s) => { const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, s, s); });
const rayTex = tex((x, s) => { x.translate(s/2, s/2); for (let i = 0; i < 18; i++) { x.rotate(Math.PI / 9); const g = x.createLinearGradient(0, 0, s/2, 0); g.addColorStop(0, 'rgba(255,215,235,.95)'); g.addColorStop(1, 'rgba(255,215,235,0)'); x.fillStyle = g; const w = i % 2 ? 5 : 11; x.beginPath(); x.moveTo(0, -2); x.lineTo(s/2, -w); x.lineTo(s/2, w); x.lineTo(0, 2); x.fill(); } }, 512);
const mk = (s, draw, rep) => { const t = tex(draw, s); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(...rep); t.anisotropy = MOB ? 2 : 4; return t; };
const barkTex = mk(256, (x, s) => {
  x.fillStyle = '#5b4733'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 1500; i++) { const a = rnd(.05, .35); x.strokeStyle = Math.random() < .6 ? `rgba(25,15,8,${a})` : `rgba(150,120,85,${a})`; x.lineWidth = rnd(1, 3); const px = rnd(0, s), py = rnd(0, s); x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-3, 3), py + rnd(15, 70)); x.stroke(); }
  for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(70,120,45,${rnd(.06, .2)})`; x.beginPath(); x.arc(rnd(0, s), rnd(0, s), rnd(6, 22), 0, 7); x.fill(); }
}, [2, 5]);
const grassTex = mk(256, (x, s) => {
  x.fillStyle = '#2a5a28'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 3500; i++) { x.strokeStyle = `hsla(${rnd(85, 125)},55%,${rnd(18, 38)}%,.6)`; x.lineWidth = 1.2; const px = rnd(0, s), py = rnd(0, s); x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-2, 2), py - rnd(3, 10)); x.stroke(); }
}, [26, 26]);
const furTex = mk(256, (x, s) => {
  x.fillStyle = '#dcdcdc'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 3000; i++) { const g = Math.floor(rnd(140, 255)); x.strokeStyle = `rgba(${g},${g},${g},.5)`; x.lineWidth = rnd(1, 2); const px = rnd(0, s), py = rnd(0, s); x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-1.5, 1.5), py + rnd(8, 26)); x.stroke(); }
}, [2, 2]);
const leafTex = mk(256, (x, s) => {
  x.strokeStyle = '#3b5d25'; x.lineWidth = 3; x.beginPath(); x.moveTo(128, 252); x.lineTo(128, 24); x.stroke();
  const leaf = (px, py, a, len) => {
    x.save(); x.translate(px, py); x.rotate(a);
    const g = x.createLinearGradient(0, 0, len * 2, 0); g.addColorStop(0, '#2d6a2a'); g.addColorStop(1, '#7cc04e'); x.fillStyle = g;
    x.beginPath(); x.ellipse(len, 0, len, len * .36, 0, 0, 7); x.fill();
    x.strokeStyle = 'rgba(210,240,170,.45)'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(0, 0); x.lineTo(len * 2, 0); x.stroke(); x.restore();
  };
  for (let i = 0; i < 9; i++) { const y = 240 - i * 24, len = 52 - i * 3.2; leaf(128, y, -.95, len); leaf(128, y - 8, Math.PI + .95, len); }
  leaf(128, 28, -Math.PI / 2, 34);
});
// entorno para reflejos (metal dorado, satén)
const envC = document.createElement('canvas'); envC.width = 512; envC.height = 256;
const ex = envC.getContext('2d'), eg = ex.createLinearGradient(0, 0, 0, 256);
eg.addColorStop(0, '#c9d6b0'); eg.addColorStop(.45, '#7aa86a'); eg.addColorStop(.55, '#1f3d24'); eg.addColorStop(1, '#0b1a0e');
ex.fillStyle = eg; ex.fillRect(0, 0, 512, 256);
for (let i = 0; i < 12; i++) { ex.fillStyle = 'rgba(255,236,200,.5)'; ex.fillRect(rnd(0, 512), rnd(0, 90), rnd(20, 70), rnd(6, 24)); }
scene.environment = new THREE.PMREMGenerator(renderer).fromEquirectangular(new THREE.CanvasTexture(envC)).texture;
const ADD = { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false };

// suelo (Lambert, sin bump: más barato)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshLambertMaterial({ map: grassTex }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
{ const o = new THREE.Object3D(), c = new THREE.Color(), nb = MOB ? 70 : 130, nt = MOB ? 30 : 46;
  const BU = new THREE.InstancedMesh(SPH, lam(0xffffff), nb);
  for (let i = 0; i < nb; i++) { const sc = rnd(.5, 1.5); o.position.set(rnd(-17, 13), 0, rnd(-7, 10)); o.rotation.set(0, rnd(0, 6.3), 0); o.scale.set(sc, sc * .55, sc); o.updateMatrix(); BU.setMatrixAt(i, o.matrix); BU.setColorAt(i, c.setHSL(rnd(.25, .34), .55, rnd(.14, .27))); }
  scene.add(BU);
  const TR = new THREE.InstancedMesh(new THREE.CylinderGeometry(.85, 1, 44, 8), lam(0xffffff), nt);
  for (let i = 0; i < nt; i++) { const r = rnd(.5, 1.1), fg = i < 5;
    o.position.set(fg ? TX + (Math.random() < .5 ? -1 : 1) * rnd(12, 17) : TX + rnd(-24, 24), 22, fg ? rnd(2, 8) : rnd(-28, -5));
    if (!fg && Math.abs(o.position.x - TX) < 3) o.position.x += 6;
    o.rotation.set(0, 0, 0); o.scale.set(r, 1, r); o.updateMatrix(); TR.setMatrixAt(i, o.matrix); TR.setColorAt(i, c.setHSL(rnd(.2, .3), .35, rnd(.1, .18))); }
  scene.add(TR); }

// árbol principal
const BARK = lam(0xffffff, { map: barkTex, bumpMap: barkTex, bumpScale: 1, roughness: 1 });
const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.55, .9, 22, 14), BARK);
trunk.position.set(TX, 11, 0); scene.add(trunk);
{ const o = new THREE.Object3D(), c = new THREE.Color(), TB = new THREE.InstancedMesh(SPH, lam(0xffffff), 40);
  for (let i = 0; i < 40; i++) { const y = rnd(.3, 18), a = rnd(0, Math.PI), rad = .85 - y * .015;
    o.rotation.set(0, 0, 0); o.scale.set(rnd(.15, .3), rnd(.2, .5), rnd(.15, .3)); o.position.set(TX + Math.cos(a) * rad, y, Math.sin(a) * rad); o.updateMatrix(); TB.setMatrixAt(i, o.matrix); TB.setColorAt(i, c.setHSL(rnd(.24, .31), .55, rnd(.16, .26))); }
  scene.add(TB); }
function branch(a, b, r) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r * .75, r, len, 10), BARK);
  m.position.addVectors(a, b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); scene.add(m);
}

/* ---------- lianas (estilo Tarzán) ---------- */
const L = 4.6, NL = 6, legs = [];
for (let k = 0, A = V(-5.5, 1.9, Z); k < NL; k++) {
  const d = k % 2 ? -1 : 1, ta = -d * .35, tb = d * 1.0;
  const O = V(A.x - L * Math.sin(ta), A.y + L * Math.cos(ta), Z);
  const B = V(O.x + L * Math.sin(tb), O.y - L * Math.cos(tb), Z);
  legs.push({ A: A.clone(), O, B, ta, tb, d }); A = B;
}
const vines = legs.map(g => {
  branch(V(TX, g.O.y - .5, 0), g.O, .22);
  const v = mesh(new THREE.CylinderGeometry(.05, .04, 1, 6), 0x55823a); scene.add(v);
  const knot = mesh(SPH, 0x3a5a24); knot.scale.setScalar(.18); knot.position.copy(g.O); scene.add(knot);
  return v;
});
const PLAT = legs[NL - 1].B.y - .7;               // altura de la plataforma final
const boxPos = V(-9.1, PLAT + .45, Z);
branch(V(TX, PLAT - .25, 0), V(-10.8, PLAT - .25, Z), .27);

// hojas
const leafPos = [];
for (let i = 0; i < (MOB ? 420 : 640); i++) {
  if (Math.random() < .7) leafPos.push([TX + rnd(-11, 11), rnd(2, 20), rnd(-9, -1.8)]);
  else leafPos.push([TX + (Math.random() < .5 ? -1 : 1) * rnd(7.5, 12), rnd(1, 18), rnd(-4.5, -1.6)]);
}
legs.forEach(g => { for (let k = 0; k < 9; k++) leafPos.push([g.O.x + rnd(-1.8, 1.8), g.O.y + rnd(-.2, 1.3), rnd(-2.4, -.9)]); });
for (let k = 0; k < 12; k++) leafPos.push([TX + rnd(-3, 3), rnd(18, 21), rnd(-3, -1)]);
for (let i = 0; i < (MOB ? 120 : 260); i++) leafPos.push([TX + rnd(-15, 15), rnd(15, 23), rnd(-9, -.5)]);   // dosel denso
for (let i = 0; i < (MOB ? 70 : 150); i++) leafPos.push([TX - rnd(9, 15), rnd(0, 14), rnd(-6, 2)]);          // pared lateral
const PER = MOB ? 3 : 4, leafMat = new THREE.MeshLambertMaterial({ map: leafTex, alphaTest: .45, side: THREE.DoubleSide });
const leaves = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.9, 1.9), leafMat, leafPos.length * PER + 260);
const tmp = new THREE.Object3D(), tc = new THREE.Color(); let li = 0;
leafPos.forEach(p => { for (let k = 0; k < PER; k++) {
  tmp.position.set(p[0] + rnd(-.9, .9), p[1] + rnd(-.9, .9), p[2] + rnd(-.5, .5)); tmp.rotation.set(rnd(-1.2, 1.2), rnd(0, 6.3), rnd(0, 6.3)); tmp.scale.setScalar(rnd(.7, 1.25)); tmp.updateMatrix();
  leaves.setMatrixAt(li, tmp.matrix); leaves.setColorAt(li++, tc.setHSL(rnd(.2, .3), rnd(.35, .6), rnd(.48, .7)));
} });
for (let k = 0; k < (MOB ? 160 : 260); k++) {   // helechos en el suelo
  tmp.rotation.order = 'YXZ'; tmp.position.set(TX + rnd(-16, 14), rnd(.25, .6), rnd(-5, 10)); tmp.rotation.set(-1 + rnd(-.3, .3), rnd(0, 6.3), 0); tmp.scale.setScalar(rnd(.7, 1.4)); tmp.updateMatrix();
  leaves.setMatrixAt(li, tmp.matrix); leaves.setColorAt(li++, tc.setHSL(rnd(.24, .33), .5, rnd(.5, .72)));
}
leaves.count = li;
scene.add(leaves);
{ const FL = new THREE.InstancedMesh(SPH, new THREE.MeshStandardMaterial({ roughness: .6 }), 170), fc = [0xff6f9c, 0xfff1b0, 0xffffff, 0xd9a6ff, 0xffb347];

  hemi.intensity = lerp(.6, .38, lightK); sun.intensity = lerp(1.7, .6, lightK); rim.intensity = lerp(.7, .9, lightK); spot.intensity = 1.8 * lightK; mLight.intensity = lerp(1.1, 1.9, lightK);
  { const pk = lightK * ease((cakeT - 2.3) / .6) * 1.5, cx = boxPos.x + .85;
    pl1.position.set(cx + Math.cos(T * 1.2) * 3.5, boxPos.y + 1.5, Z + 2.5 + Math.sin(T * 1.2) * 1.5); pl2.position.set(cx - Math.cos(T * 1.2) * 3.5, boxPos.y + 1.2, Z + 2.5 - Math.sin(T * 1.2) * 1.5);
    pl1.intensity = pl2.intensity = pk; }

  // cohetes
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.t += dt; r.p.addScaledVector(r.v, dt);
    for (let n = 0; n < 3; n++) emit(r.p.x, r.p.y, r.p.z, rnd(-.4, .4), rnd(-1, 0), rnd(-.4, .4), PAL[0], rnd(.4, .7));
    if (r.t > r.fuse) { explode(r.p); rockets.splice(i, 1); }
  }
  // chispas
  for (let i = 0; i < N; i++) {
    if (sl[i] <= 0) { if (sp[i*3+1] > -900) sp[i*3+1] = -999; continue; }
    const j = i * 3; sl[i] -= dt; const f = Math.max(0, sl[i] / sm[i]);
    sv[j+1] -= 3.2 * dt; const dr = 1 - 1.3 * dt; sv[j] *= dr; sv[j+1] *= dr; sv[j+2] *= dr;
    sp[j] += sv[j] * dt; sp[j+1] += sv[j+1] * dt; sp[j+2] += sv[j+2] * dt;
    const tw = .7 + .3 * Math.sin(T * 30 + i); sc[j] = sb[j] * f * tw; sc[j+1] = sb[j+1] * f * tw; sc[j+2] = sb[j+2] * f * tw;
  }
  sgeo.attributes.position.needsUpdate = sgeo.attributes.color.needsUpdate = true;
  // confeti
  for (let i = 0; i < CN; i++) {
    const j = i * 3; if (cp[j+1] < -900) continue;
    cv[j+1] -= 6.5 * dt; cv[j] *= 1 - .4 * dt; cv[j+2] *= 1 - .4 * dt;
    cp[j] += cv[j] * dt + Math.sin(T * 4 + i) * .012; cp[j+1] += cv[j+1] * dt; cp[j+2] += cv[j+2] * dt;
    if (cp[j+1] < PLAT - 6) cp[j+1] = -999;
  }
  cgeo.attributes.position.needsUpdate = true;

  // corazones y globos
  if (state === 'party') floaters.forEach(h => {
    h.age += dt; if (h.age < 0) return; h.m.visible = true;
    h.m.position.set(top.x + h.off * 5 + Math.sin(h.age * 1.4 + h.ph) * .6, top.y + .3 + h.age * h.sp, top.z - 1.8 + Math.sin(h.age + h.ph) * .5);
    h.m.scale.setScalar(h.size * .8 * Math.min(1, h.age * 2.5));
    h.m.rotation.y = Math.sin(h.age * 2 + h.ph) * .7; h.m.rotation.z = Math.sin(h.age * 1.6 + h.ph) * .15;
    if (h.age * h.sp > 11) h.age = 0;
  });

  if (state === 'party') {
    petals.visible = true;
    pd.forEach((p, i) => {
      p.y -= dt * p.f; if (p.y < -5) p.y = 9;
      tmp.position.set(boxPos.x + 1 + p.x + Math.sin(T * .8 + p.ph) * .8, boxPos.y + p.y, boxPos.z + p.z);
      tmp.rotation.set(T * p.f + p.ph, T * .7 + p.ph, T * .5); tmp.scale.set(.16 * p.s, .025, .1 * p.s); tmp.updateMatrix(); petals.setMatrixAt(i, tmp.matrix);
    });
    petals.instanceMatrix.needsUpdate = true;
  }
  flies.position.y = Math.sin(T * .6) * .4; flies.rotation.y = T * .02; mist.forEach(m => { m.position.x += dt * .25; if (m.position.x > TX + 15) m.position.x = TX - 17; }); dust.rotation.y = Math.sin(T * .05) * .2; dust.position.y = Math.sin(T * .4) * .3; fmat.opacity = .6 + Math.sin(T * 3) * .3;
  if (composer) { bloom.strength = lerp(.18, .3, lightK); grade.uniforms.time.value = T % 100; composer.render(); } else renderer.render(scene, camera);
}

// precalentar shaders, texturas y sombras (evita el tirón al abrir la caja)
{
  const hidden = [];
  scene.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });
  renderer.shadowMap.needsUpdate = true;
  try { renderer.compile(scene, camera); composer ? composer.render() : renderer.render(scene, camera); } catch (e) {}
  hidden.forEach(o => { o.visible = false; });
}
loop();

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); if (composer) composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
})();
</script>
</body>
</html>
